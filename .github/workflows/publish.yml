name: Publish NuGet Package
on:
  release:
    types: [created]
  workflow_dispatch:

env:
  OPENTRANSIT_VERSION: 8.5.8

jobs:
  publish:
    name: Build and Publish NuGets
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Calculate Version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          # Use tag name from release (strip 'v' prefix if present)
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        else
          # For manual dispatch, use env version with run number
          echo "version=${OPENTRANSIT_VERSION}-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
        fi

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

    - name: Pack
      run: dotnet pack --no-build --configuration Release -p:PackageVersion=${{ steps.version.outputs.version }} -o ./out

    - name: Push
      run: |
        dotnet nuget push "out/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
